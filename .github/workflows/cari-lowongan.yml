name: Cari lowongan

on:
  schedule:
    - cron: "17 23 * * *"   # setiap hari pukul 06.17 WIB
  workflow_dispatch:          # tombol "Run workflow" untuk menjalankan manual

jobs:
  cari:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - run: python scripts/cari_lowongan.py
