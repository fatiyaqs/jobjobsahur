<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Job Vacancy Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen spreadsheet app — title bar → quick-add → ribbon → formula bar → grid/cards → sheet tabs. Paper white, sage-green ink. */
:root{
  --bg:#FBFCFB; --paper:#FFFFFF; --hdr:#F1F4F2; --hdr2:#E8EDEA; --grid:#E1E7E3; --hover:#F5F8F6;
  --ink:#17241F; --muted:#5D6B65; --accent:#1E7558; --accent-ink:#FFFFFF; --accent-soft:#DDEFE7; --sel:#1E7558;
  --late:#C4372C; --urgent:#D46F12; --soon:#A88100; --ok:#2B8150; --off:#7F8A86; --info:#2E66A8; --violet:#6A4CB8;
  --late-bg:#FBE4E1; --urgent-bg:#FDE9D5; --soon-bg:#FAF0C6; --ok-bg:#DCF0E3; --off-bg:#ECEFED; --info-bg:#E0EBF7; --violet-bg:#ECE6F8;
  --f-ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --paper:#141C19; --hdr:#1A2420; --hdr2:#202C27; --grid:#26332E; --hover:#18221E;
  --ink:#E2EAE6; --muted:#8FA099; --accent:#52B892; --accent-ink:#06211A; --accent-soft:#1A3329; --sel:#52B892;
  --late:#F06A5E; --urgent:#F29A48; --soon:#E3C042; --ok:#5CC48A; --off:#87938F; --info:#6FA4E6; --violet:#A991F0;
  --late-bg:#3A1D1A; --urgent-bg:#3A2715; --soon-bg:#342C0F; --ok-bg:#16301F; --off-bg:#222B28; --info-bg:#172A40; --violet-bg:#271F40;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --paper:#141C19; --hdr:#1A2420; --hdr2:#202C27; --grid:#26332E; --hover:#18221E;
  --ink:#E2EAE6; --muted:#8FA099; --accent:#52B892; --accent-ink:#06211A; --accent-soft:#1A3329; --sel:#52B892;
  --late:#F06A5E; --urgent:#F29A48; --soon:#E3C042; --ok:#5CC48A; --off:#87938F; --info:#6FA4E6; --violet:#A991F0;
  --late-bg:#3A1D1A; --urgent-bg:#3A2715; --soon-bg:#342C0F; --ok-bg:#16301F; --off-bg:#222B28; --info-bg:#172A40; --violet-bg:#271F40;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.4;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* title bar */
.titlebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:12px 10px;border-bottom:1px solid var(--grid);background:var(--paper);flex:none}
.logo{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px;flex:none}
.logo i{background:var(--accent-ink);opacity:.7;border-radius:1px}
.logo i:nth-child(-n+3){opacity:1}
h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.live{display:inline-flex;align-items:center;gap:5px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.live.wait::before{background:var(--off)}
.grow{flex:1}
.me{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--grid);border-radius:999px;padding:3px 10px 3px 3px;font-weight:600;font-size:12px}
.me img{width:22px;height:22px;border-radius:50%}
.btn{border:1px solid var(--grid);background:var(--paper);border-radius:7px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* quick add */
.qa{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:9px;background:var(--accent-soft);border-bottom:1px solid var(--grid);flex:none}
.qa-l{font-weight:800;font-size:12px;color:var(--accent);margin-right:2px;white-space:nowrap}
.qa input{background:var(--paper);border:1px solid var(--grid);border-radius:7px;padding:6px 9px;min-width:0;font-size:13px}
.qa input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
#qaCo{flex:1.3 1 170px}#qaPos{flex:1 1 150px}#qaLink{flex:1.3 1 170px}
.qa-dl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);flex:0 1 auto}
.qa-dl input{font-family:var(--f-num);font-size:12px}
.qa-hint{font-size:11.5px;color:var(--muted);width:100%}

/* ribbon */
.ribbon{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:8px;background:var(--hdr);border-bottom:1px solid var(--grid)}
.ribbon .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.ribbon input,.ribbon select{background:var(--paper);border:1px solid var(--grid);border-radius:6px;padding:5px 8px;min-width:0;font-size:12.5px}
.ribbon .search{flex:1 1 200px;max-width:320px}
.ribbon select{flex:0 1 150px}
.rtop,.rfil{display:contents}
.cnt{margin-left:auto;color:var(--muted);font-size:12px;order:99}
.who{font-size:12px;color:var(--muted);white-space:nowrap}
.who b{color:var(--accent)}
.mob{display:none}

/* formula bar */
.fbar{display:flex;align-items:stretch;border-bottom:1px solid var(--grid);background:var(--paper);min-height:32px}
.namebox{width:72px;flex:none;border-right:1px solid var(--grid);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.fx{width:34px;flex:none;display:flex;align-items:center;justify-content:center;font-style:italic;font-family:Georgia,serif;color:var(--muted);border-right:1px solid var(--grid)}
#fbar{flex:1;min-width:0;border:0;background:transparent;padding:6px 10px;outline:none}
#fbar:read-only{color:var(--muted)}

/* grid */
.gridwrap{flex:1;min-height:0;overflow:auto;background:var(--paper);position:relative}
table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed;--c0:44px}
.sheet th,.sheet td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0;height:34px;background:var(--paper);vertical-align:middle}
.sheet thead th{position:sticky;background:var(--hdr);font-weight:600;z-index:3}
.sheet thead tr.letters th{top:0;height:22px;font-family:var(--f-num);font-size:11px;color:var(--muted);text-align:center;font-weight:400}
.sheet thead tr.names th{top:22px;height:36px;text-align:left;padding:0 8px;font-size:11.5px;letter-spacing:.02em;color:var(--ink);background:var(--hdr2);cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet thead tr.names th.mine{background:color-mix(in srgb,var(--accent-soft) 70%,var(--hdr2))}
.sheet thead tr.names th:hover,.sheet thead tr.names th.sorted{color:var(--accent)}
.sheet thead th.on{background:var(--accent-soft);color:var(--accent)}
.rh{position:sticky;left:0;z-index:2;width:48px;text-align:center;font-family:var(--f-num);font-size:11.5px;color:var(--muted);background:var(--hdr)!important}
thead .rh{z-index:5}
.sheet .sk1{position:sticky;left:48px;z-index:2}
.sheet .sk2{position:sticky;left:calc(48px + var(--c0));z-index:2;box-shadow:2px 0 0 var(--grid)}
.sheet thead .sk1,.sheet thead .sk2{z-index:5}
.sheet tbody tr:hover td{background:var(--hover)}
.sheet tbody tr.act .rh{background:var(--accent-soft)!important;color:var(--accent)}
.cell{width:100%;height:33px;border:0;background:transparent;padding:0 8px;outline:none;border-radius:0;min-width:0;text-overflow:ellipsis}
.cell:focus{box-shadow:inset 0 0 0 2px var(--sel);background:var(--paper)}
input[type=date].cell{font-family:var(--f-num);font-size:12px}
.cell[disabled]{cursor:default;opacity:1;color:inherit}
td.c{position:relative}
.co .cell{font-weight:700}
.go{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:12px;text-decoration:none;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 5px;font-weight:700}
td.c:has(.go) .cell{padding-right:30px}
.chkc{text-align:center}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.calc{padding:0 8px;font-family:var(--f-num);font-size:12px;font-weight:500;white-space:nowrap}
.metac{padding:0 8px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select.cell{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:22px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.chipwrap{padding:0 6px}
select.chip{height:24px;border-radius:999px;font-size:11.5px;font-weight:700;padding:0 22px 0 10px;width:auto;max-width:100%;background-color:var(--off-bg);color:var(--off)}
select.chip:focus{box-shadow:0 0 0 2px var(--sel)}
select.chip option{background:var(--paper);color:var(--ink);font-weight:500}
select.chip[data-v="Persiapan Dokumen"],select.chip[data-v="Sedang Dilengkapi"]{background-color:var(--soon-bg);color:var(--soon)}
select.chip[data-v="Siap Apply"],select.chip[data-v="Sudah Apply"]{background-color:var(--info-bg);color:var(--info)}
select.chip[data-v="Lolos Administrasi"],select.chip[data-v="Tes Seleksi"],select.chip[data-v="Interview HR"],select.chip[data-v="Interview User"]{background-color:var(--violet-bg);color:var(--violet)}
select.chip[data-v="Offering"],select.chip[data-v="Lengkap"],select.chip[data-v="Sudah Follow Up"]{background-color:var(--ok-bg);color:var(--ok)}
select.chip[data-v="Diterima"]{background-color:var(--ok);color:var(--paper)}
select.chip[data-v="Ditolak"],select.chip[data-v="High"]{background-color:var(--late-bg);color:var(--late)}
select.chip[data-v="Perlu Follow Up"],select.chip[data-v="Medium"]{background-color:var(--urgent-bg);color:var(--urgent)}
tr.b-late td.dl,tr.b-late td.sisa{background:var(--late-bg)!important;color:var(--late)}
tr.b-urgent td.dl,tr.b-urgent td.sisa{background:var(--urgent-bg)!important;color:var(--urgent)}
tr.b-soon td.dl,tr.b-soon td.sisa{background:var(--soon-bg)!important;color:var(--soon)}
tr.b-ok td.dl,tr.b-ok td.sisa{background:var(--ok-bg)!important;color:var(--ok)}
tr.off td{background:var(--off-bg)!important;color:var(--muted)}
tr.off .co .cell{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.del{display:none;position:absolute;inset:3px;border:0;border-radius:5px;background:var(--late-bg);color:var(--late);font-weight:800;cursor:pointer;font-size:11px}
tr:hover .rh .del{display:block}
.del.armed{display:block;background:var(--late);color:var(--paper)}
.emptyrow td{padding:28px 16px;color:var(--muted);text-align:left}

/* tabs */
.tabs{display:flex;align-items:stretch;gap:2px;background:var(--hdr);border-top:1px solid var(--grid);overflow-x:auto;padding-block:0 env(safe-area-inset-bottom,0px);flex:none}
.tab{border:0;border-right:1px solid var(--grid);background:transparent;padding:9px 16px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap;display:inline-flex;gap:7px;align-items:center;border-top:3px solid transparent;flex:none}
.tab:hover{color:var(--ink);background:var(--hdr2)}
.tab.on{background:var(--paper);color:var(--accent);border-top-color:var(--accent)}
.tab b{font-family:var(--f-num);font-weight:500;font-size:11px;background:var(--hdr2);border-radius:999px;padding:0 7px;color:var(--muted)}
.tab.on b{background:var(--accent-soft);color:var(--accent)}
.tab.add{color:var(--accent);font-weight:700}
.tab.rm{color:var(--late)}
.newtab{display:flex;align-items:center;gap:6px;padding:5px 8px;flex:none}
.newtab input{width:170px;border:1px solid var(--accent);border-radius:6px;padding:5px 8px;background:var(--paper);font-size:16px}
.newtab .btn{padding:5px 10px}

/* dashboard */
.dash{flex:1;min-height:0;overflow:auto;background:var(--bg)}
.dash-in{max-width:1280px;margin:0 auto;padding-block:18px 32px;display:flex;flex-direction:column;gap:16px}
.dhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dhead h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.dhead select{background:var(--paper);border:1px solid var(--grid);border-radius:7px;padding:6px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--grid);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.kpi .v{font-family:var(--f-num);font-size:clamp(22px,3vw,30px);font-weight:500;line-height:1.15}
.kpi .l{font-weight:700;font-size:12.5px}
.kpi .s{color:var(--muted);font-size:11.5px}
.kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hl .s{color:inherit;opacity:.8}
.kpi.warn .v{color:var(--urgent)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:860px){.charts{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--grid);border-radius:10px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:12px;background:none;border:0;padding:2px 0;font-family:inherit;text-align:left;cursor:pointer}
.bar:hover .lab{color:var(--accent)}
.bar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:11px;background:var(--hdr);border-radius:3px;overflow:hidden;background-image:linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:25% 100%}
.bar .fill{display:block;height:100%;border-radius:3px}
.bar .n{font-family:var(--f-num);text-align:right}
.stack{display:flex;height:20px;border-radius:5px;overflow:hidden;background:var(--hdr)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--grid);border-radius:999px;padding:3px 10px 3px 8px;background:none;cursor:pointer}
.lg i{width:9px;height:9px;border-radius:50%}
.lg b{font-family:var(--f-num);font-weight:500}
.minibox{overflow-x:auto}
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini td,.mini th{padding:7px 6px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
.mini th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mini .num{text-align:right}
.mini button{background:none;border:0;padding:0;font-weight:700;color:var(--accent);cursor:pointer}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-family:var(--f-num);font-size:11.5px;white-space:nowrap}
.pill.b-late{background:var(--late-bg);color:var(--late)}.pill.b-urgent{background:var(--urgent-bg);color:var(--urgent)}
.pill.b-soon{background:var(--soon-bg);color:var(--soon)}.pill.b-ok{background:var(--ok-bg);color:var(--ok)}
.pill.b-off,.pill.b-none{background:var(--off-bg);color:var(--off)}
.empty-c{color:var(--muted)}
.notice{background:var(--accent-soft);color:var(--ink);font-size:12px;padding-block:6px;border-bottom:1px solid var(--grid)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(56px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:8px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}

/* card view */
.cards{flex:1;min-height:0;overflow:auto;background:var(--bg);padding-block:12px 24px}
.cards-in{display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto;width:100%}
.cards-h{color:var(--muted);font-size:12px;padding:0 2px}
.jcard{background:var(--paper);border:1px solid var(--grid);border-radius:12px;overflow:hidden;box-shadow:inset 4px 0 0 var(--stripe,transparent);flex:none}
.jcard.off{background:var(--off-bg)}
.jc-top{display:flex;align-items:center;gap:8px;padding:10px 12px 0 16px}
.jc-top input[type=checkbox]{width:22px;height:22px;flex:none}
.jc-top .cell{font-weight:700;font-size:15px;padding:0 4px;height:32px;flex:1}
.jc-pos,.jc-chips,.jc-row,.jc-ppl{padding-left:44px;padding-right:12px}
.nochk .jc-pos,.nochk .jc-chips,.nochk .jc-row,.nochk .jc-ppl{padding-left:16px}
.jc-pos .cell{padding:0 4px;height:28px;color:var(--muted)}
.jc-chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.jc-chips .chipwrap{padding:0}
.jc-chips select.chip,.jc-ppl select.chip{height:30px;font-size:12.5px}
.jc-row{display:flex;flex-wrap:wrap;gap:6px 10px;padding-top:10px;padding-bottom:12px;align-items:center;font-size:12px;color:var(--muted)}
.jc-dl{display:inline-flex;align-items:center;gap:6px}
.jc-dl .cell{width:auto;height:30px;border:1px solid var(--grid);border-radius:7px;padding:0 6px;background:var(--paper)}
.jc-row a{font-weight:700;text-decoration:none;color:var(--accent)}
.jc-ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding-bottom:12px}
.pp{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;color:var(--muted);min-width:0}
.pp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .chipwrap{padding:0}
.jc-more{border-top:1px solid var(--grid)}
.jc-more summary{padding:10px 16px;cursor:pointer;font-weight:700;color:var(--accent);font-size:12.5px;list-style:none;display:flex;justify-content:space-between}
.jc-more summary::-webkit-details-marker{display:none}
.jc-more summary::after{content:"▾"}
.jc-more[open] summary::after{content:"▴"}
.jc-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:2px 16px 16px}
@media (max-width:480px){.jc-fields{grid-template-columns:1fr}}
.jc-f{display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.jc-f.full{grid-column:1/-1}
.jc-f.sep{grid-column:1/-1;font-size:10.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;padding-top:4px}
.jc-f label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.jc-f .cell{border:1px solid var(--grid);border-radius:7px;height:38px;background-color:var(--paper)}
.jc-f .chipwrap{padding:0}
.jc-f select.chip{height:32px;border:0}
.jc-f .go{top:auto;bottom:10px;transform:none}
.jc-f input[type=checkbox]{width:20px;height:20px}
.jc-foot{flex-direction:row;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.jc-foot .metac{padding:0}

@media (prefers-reduced-motion:no-preference){.fill,.stack span{transition:width .35s ease}}
@media (max-width:700px){
  .titlebar{padding-block:10px 8px;gap:8px}
  .titlebar #today{display:none}
  h1{font-size:15px}
  .logo{width:26px;height:26px;padding:5px}
  #meName{display:none}.me{padding:2px}
  #copyBtn{display:none}
  .titlebar .btn{padding:6px 9px;font-size:12px}

}

  const rate=sent.length?Math.round(acc/sent.length*1000)/10:0,lrate=sent.length?Math.round(lolos/sent.length*100):0;
  const sub=multi?`gabungan ${P.length} orang`:"";
  const K=[["Total Lowongan",total,"daftar yang sama untuk semua"],["Belum Dilamar",belum,multi?sub:"lowongan masih aktif"],["Lamaran Terkirim",sent.length,multi?sub:`${total?Math.round(sent.length/total*100):0}% dari total`],["Proses Seleksi",sel,"administrasi s.d. offering"],["Diterima",acc,sub],["Ditolak",rej,sub],["Deadline 7 Hari",up.length,`${upOpen} lamaran belum dikirim`,up.length?"warn":""],["Tingkat Keberhasilan",rate.toLocaleString("id-ID")+"%",`diterima ÷ terkirim · lolos tahap awal ${lrate}%`,"hl"]];
  const stCol=s=>s==="Diterima"?"var(--ok)":s==="Ditolak"?"var(--late)":s==="Tidak Ada Kabar"?"var(--off)":SELEKSI.has(s)?"var(--violet)":PRE.has(s)?"color-mix(in srgb,var(--accent) 40%,var(--paper))":"var(--info)";
  const bk=["late","urgent","soon","ok","off","none"].map(b=>[b,rows.filter(r=>bucket(r)===b).length]).filter(x=>x[1]||x[0]!=="none");
  const perPerson=all.map(n=>{const s=rows.map(r=>stOf(r,n));return{n,sent:s.filter(x=>!PRE.has(x)).length,sel:s.filter(x=>SELEKSI.has(x)).length,acc:s.filter(x=>x==="Diterima").length,open:rows.filter((r,i)=>isActive(r)&&PRE.has(s[i])).length}});
  $("#dashIn").innerHTML=`
  <div class="dhead"><h2>Ringkasan lamaran</h2><label>Orang&nbsp; <select id="dScope"><option value="">Semua orang</option>${all.map(p=>`<option${p===dashScope?" selected":""}>${esc(p)}</option>`).join("")}</select></label></div>
  <div class="kpis">${K.map(([l,v,s,c])=>`<div class="kpi ${c||""}"><span class="v">${v}</span><span class="l">${l}</span>${s?`<span class="s">${s}</span>`:""}</div>`).join("")}</div>
  <div class="charts">
    <div class="card"><h3>Pipeline status lamaran</h3>${bars(STATUS.map(s=>[s,pairs.filter(x=>x.st===s).length,stCol(s)]),"","status")}</div>
    <div class="card"><h3>Kondisi deadline</h3><div class="stack">${total?bk.map(([b,n])=>n?`<span style="width:${n/total*100}%;background:${BCOL[b]}" title="${BUCKET[b]}: ${n}"></span>`:"").join(""):""}</div>
      <div class="legend">${bk.map(([b,n])=>`<button class="lg" data-dl="${b}"><i style="background:${BCOL[b]}"></i>${BUCKET[b]} <b>${n}</b></button>`).join("")}</div>
      <h3 style="margin-top:6px">Deadline 7 hari ke depan</h3>
      ${up.length?`<div class="minibox"><table class="mini"><tr><th>Perusahaan</th><th>Posisi</th><th>Sisa</th><th>${multi?"Sudah melamar":"Status"}</th></tr>${up.slice(0,6).map(r=>`<tr><td><b>${esc(r.perusahaan)}</b></td><td>${esc(r.posisi||"–")}</td><td><span class="pill b-${bucket(r)}">${sisaText(r)}</span></td><td>${multi?`${P.filter(n=>appliedP(r,n)).length}/${P.length} orang`:esc(stOf(r,P[0]))}</td></tr>`).join("")}</table></div>`:`<div class="empty-c">Tidak ada deadline dalam 7 hari.</div>`}
    </div>
    ${all.length?`<div class="card"><h3>Progres per orang</h3><div class="minibox"><table class="mini"><tr><th>Nama</th><th class="num">Terkirim</th><th class="num">Seleksi</th><th class="num">Diterima</th><th class="num">Belum dilamar</th></tr>${perPerson.map(x=>`<tr><td><button data-person="${esc(x.n)}">${esc(x.n)}</button></td><td class="num">${x.sent}</td><td class="num">${x.sel}</td><td class="num">${x.acc}</td><td class="num">${x.open}</td></tr>`).join("")}</table></div></div>`:""}
    <div class="card"><h3>Bidang pekerjaan</h3>${bars(countBy(rows,r=>r.bidang).slice(0,8),"var(--accent)","bidang")}</div>
    <div class="card"><h3>Sumber lowongan</h3>${bars(countBy(rows,r=>r.sumber).slice(0,6),"var(--info)","")}</div>
    <div class="card"><h3>Prioritas (lowongan aktif)</h3>${bars(PRIO.map(x=>[x,pairs.filter(y=>isActive(y.r)&&(y.pr.prioritas||"Medium")===x).length,x==="High"?"var(--late)":x==="Medium"?"var(--urgent)":"var(--off)"]),"","prio")}</div>
  </div>`;
  $("#dScope").onchange=e=>{dashScope=e.target.value;lsSet("jvt-dscope3",dashScope);renderDash()};
}
$("#dashIn").addEventListener("click",e=>{
  const pb=e.target.closest("[data-person]");if(pb){tab="p:"+pb.dataset.person;lsSet("jvt-tab3",tab);render();return}
  const lg=e.target.closest(".lg"),bar=e.target.closest(".bar");let key,val;
  if(lg){if(lg.dataset.dl==="none")return;key="dl";val=lg.dataset.dl}
  else if(bar){key=bar.closest(".bars").dataset.key;val=bar.dataset.v;if(!key)return}else return;
  for(const k in F)F[k].value="";F[key].value=val;
  tab=dashScope?"p:"+dashScope:"all";lsSet("jvt-tab3",tab);saveF();render();
});
render();
</script>

</body>
</html>
